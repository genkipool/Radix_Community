packages:
  - '.'

allowBuilds:
  esbuild: true
  msw: true
  secp256k1: true
  sharp: true
  snyk: true
  unrs-resolver: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - dompurify@3.4.7
  - isomorphic-dompurify@3.15.0

trustPolicy: no-downgrade

trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - reselect@5.1.1
  - semver@6.3.1
  - undici-types@6.21.0
