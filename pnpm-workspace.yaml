packages:
  - '.'

allowBuilds:
  esbuild: true
  msw: true
  secp256k1: true
  sharp: true
  snyk: true
  unrs-resolver: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - dompurify@3.4.7
  - isomorphic-dompurify@3.15.0
  - '@next/env@16.2.7'
  - '@next/swc-darwin-arm64@16.2.7'
  - '@next/swc-darwin-x64@16.2.7'
  - '@next/swc-linux-arm64-gnu@16.2.7'
  - '@next/swc-linux-arm64-musl@16.2.7'
  - '@next/swc-linux-x64-gnu@16.2.7'
  - '@next/swc-linux-x64-musl@16.2.7'
  - '@next/swc-win32-arm64-msvc@16.2.7'
  - '@next/swc-win32-x64-msvc@16.2.7'
  - next@16.2.7

overrides:
  postcss: ^8.5.10
  uuid: ^11.1.1
  '@vercel/node>undici': ^6.24.0
  '@vercel/static-config>ajv': ^8.18.0
  smol-toml: ^1.6.1
  srvx: ^0.11.13
  path-to-regexp: ^8.4.0
  '@tootallnate/once': ^2.0.1
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  eslint-import-resolver-typescript: 3.8.0
  undici-types: 8.3.0
  minimatch: ^10.2.1
  tar: ^7.5.11
  valibot: ^1.2.0

trustPolicy: no-downgrade

trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - reselect@5.1.1
  - semver@6.3.1
  - undici-types@6.21.0
