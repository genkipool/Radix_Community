<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <!-- Background Gradients (Light Theme) -->
        <radialGradient id="bg-gold-glow" cx="10%" cy="10%" r="70%">
            <stop offset="0%" stop-color="#FCEBA7" stop-opacity="0.6"/>
            <stop offset="60%" stop-color="#F1D683" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bg-platinum-glow" cx="90%" cy="90%" r="80%">
            <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bg-center-glow" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#F6E4A3" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0"/>
        </radialGradient>

        <!-- Main Icon Gradients (Light Champagne Gold) -->
        <linearGradient id="card-front" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#F4E2A6"/>
            <stop offset="100%" stop-color="#D4AF37"/>
        </linearGradient>
        <linearGradient id="card-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D6CDBA"/>
            <stop offset="100%" stop-color="#EBE5D8"/>
        </linearGradient>

        <!-- Depth of Field Filters -->
        <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="blur-far" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5"/>
        </filter>
        <filter id="blur-extreme" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12"/>
        </filter>

        <!-- Base Tech Node Definition -->
        <g id="dot-platinum">
            <circle r="2.5" fill="#94A3B8" filter="url(#glow-soft)"/>
            <circle r="1" fill="#ffffff"/>
        </g>
        <g id="dot-gold">
            <circle r="2.5" fill="#DDAA33" filter="url(#glow-soft)"/>
            <circle r="1" fill="#ffffff"/>
        </g>

        <!-- Glassy Bubbles/Orbs -->
        <radialGradient id="glass-sphere-platinum" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="15%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#94A3B8" stop-opacity="0.2"/>
            <stop offset="95%" stop-color="#64748B" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
        </radialGradient>
        <radialGradient id="glass-sphere-gold" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="15%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.2"/>
            <stop offset="95%" stop-color="#DDAA33" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
        </radialGradient>

        <g id="orb-platinum">
            <circle r="15" fill="url(#glass-sphere-platinum)"/>
            <circle cx="-5" cy="-5" r="3" fill="#ffffff" filter="url(#glow-soft)" opacity="0.9"/>
            <circle cx="8" cy="8" r="6" fill="#CBD5E1" filter="url(#glow-soft)" opacity="0.6"/>
        </g>
        <g id="orb-gold">
            <circle r="15" fill="url(#glass-sphere-gold)"/>
            <circle cx="-5" cy="-5" r="3" fill="#ffffff" filter="url(#glow-soft)" opacity="0.9"/>
            <circle cx="8" cy="8" r="6" fill="#F4E2A6" filter="url(#glow-soft)" opacity="0.7"/>
        </g>

        <!-- 3D Wireframe Glass Cubes (Isometric) -->
        <g id="cube-platinum">
            <!-- Top Face -->
            <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#ffffff" fill-opacity="0.7" stroke="#94A3B8" stroke-width="0.8"/>
            <!-- Right Face -->
            <polygon points="18,-6 18,14 0,24 0,4" fill="#94A3B8" fill-opacity="0.15" stroke="#94A3B8" stroke-width="0.8"/>
            <!-- Left Face -->
            <polygon points="-18,-6 0,4 0,24 -18,14" fill="#CBD5E1" fill-opacity="0.25" stroke="#94A3B8" stroke-width="0.8"/>
            <!-- Inner core -->
            <circle cx="0" cy="4" r="2" fill="#ffffff" filter="url(#glow-soft)"/>
            <path d="M 0,4 L 0,24" stroke="#64748B" stroke-width="1.5" opacity="0.5"/>
        </g>

        <g id="cube-gold">
            <polygon points="0,-16 18,-6 0,4 -18,-6" fill="#ffffff" fill-opacity="0.8" stroke="#D4AF37" stroke-width="0.8"/>
            <polygon points="18,-6 18,14 0,24 0,4" fill="#DDAA33" fill-opacity="0.15" stroke="#D4AF37" stroke-width="0.8"/>
            <polygon points="-18,-6 0,4 0,24 -18,14" fill="#F2D388" fill-opacity="0.25" stroke="#D4AF37" stroke-width="0.8"/>
            <circle cx="0" cy="4" r="2" fill="#ffffff" filter="url(#glow-soft)"/>
            <path d="M 0,4 L 0,24" stroke="#B8860B" stroke-width="1.5" opacity="0.5"/>
        </g>

        <!-- Mini Padlock for Security/Assets -->
        <g id="lock-gold">
            <rect x="-6" y="-2" width="12" height="10" rx="1.5" fill="#F4E2A6" fill-opacity="0.9" stroke="#DDAA33" stroke-width="1"/>
            <path d="M -3,-2 L -3,-4 A 3 3 0 0 1 3 -4 L 3,-2" fill="none" stroke="#DDAA33" stroke-width="1.5"/>
            <circle cx="0" cy="3" r="1.5" fill="#ffffff"/>
            <line x1="0" y1="3" x2="0" y2="6" stroke="#ffffff" stroke-width="1.5"/>
        </g>
    </defs>

    <!-- ========================================== -->
    <!-- BACKGROUND BASE COLORS                     -->
    <!-- ========================================== -->
    <rect width="1200" height="560" fill="#FAF9F6"/>
    <rect width="1200" height="560" fill="url(#bg-gold-glow)"/>
    <rect width="1200" height="560" fill="url(#bg-platinum-glow)"/>
    <rect width="1200" height="560" fill="url(#bg-center-glow)"/>

    <!-- ========================================== -->
    <!-- BACKGROUND LAYER 1 (DEEP & BLURRY)         -->
    <!-- ========================================== -->
    <g filter="url(#blur-far)" opacity="0.6">
        <path d="M 100,50 L 300,150 L 350,100 M 400,400 L 600,500 L 800,400 M 800,100 L 1000,200 L 1100,150 M -50,300 L 200,400 L 300,350" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.3"/>
        <use href="#cube-platinum" x="200" y="100" transform="scale(1.2)"/>
        <use href="#cube-gold" x="900" y="450" transform="scale(1.5)"/>
        <use href="#cube-platinum" x="600" y="50" transform="scale(0.8)"/>
        <use href="#orb-gold" x="400" y="80" transform="scale(1.5)"/>
        <use href="#orb-platinum" x="800" y="500" transform="scale(2)"/>
    </g>

    <!-- ========================================== -->
    <!-- BACKGROUND LAYER 2 (MIDGROUND / SHARP)     -->
    <!-- ========================================== -->
    <!-- The main isometric/tech grid lines -->
    <g fill="none" stroke-linejoin="round" opacity="0.8">

        <!-- Platinum Network Lines -->
        <g stroke="#94A3B8" stroke-width="0.8">
            <path d="M 0,220 L 120,220 L 180,250 L 280,250 L 320,300 L 400,300 L 440,250 L 520,250"/>
            <path d="M 60,320 L 150,320 L 200,380 L 350,380 L 400,440 L 550,440 L 620,500"/>
            <path d="M 280,250 L 280,180 L 350,140 L 450,140 L 500,180 L 650,180"/>
            <path d="M 400,300 L 400,380"/>
            <path d="M 440,250 L 440,140 L 550,80 L 700,80 L 750,130"/>
            <path d="M 520,250 L 600,250 L 650,300 L 800,300 L 850,250 L 1000,250"/>
            <path d="M 350,380 L 350,480 L 450,540"/>
            <path d="M 650,300 L 650,400 L 750,450 L 900,450 L 980,380 L 1150,380"/>
            <path d="M 800,300 L 800,180 L 900,120 L 1050,120 L 1100,160"/>
        </g>

        <!-- Gold Network Lines -->
        <g stroke="#D4AF37" stroke-width="0.8" opacity="0.9">
            <path d="M 100,150 L 200,150 L 250,200 L 380,200 L 420,150 L 500,150"/>
            <path d="M 180,250 L 180,350 L 250,400 L 400,400"/>
            <path d="M 380,200 L 380,300 L 480,350 L 600,350 L 650,400 L 800,400"/>
            <path d="M 600,350 L 600,220 L 700,160 L 850,160 L 900,220 L 1050,220"/>
            <path d="M 850,160 L 850,80 L 950,50 L 1100,50"/>
            <path d="M 750,450 L 750,530"/>
            <path d="M 980,380 L 980,480 L 1100,540"/>
        </g>

        <!-- Glowing Highlights on Paths (Data Flow) -->
        <g stroke="#DDAA33" stroke-width="2" filter="url(#glow-soft)">
            <path d="M 120,220 L 180,250" opacity="0.6"/>
            <path d="M 350,140 L 450,140" opacity="0.4"/>
            <path d="M 600,350 L 650,400" opacity="0.5"/>
            <path d="M 850,250 L 1000,250" opacity="0.3"/>
            <path d="M 200,380 L 350,380" opacity="0.5"/>
        </g>
    </g>

    <!-- Main Grid Nodes -->
    <g>
        <!-- Platinum Nodes -->
        <use href="#dot-platinum" x="60" y="320"/>
        <use href="#dot-platinum" x="120" y="220"/>
        <use href="#dot-platinum" x="280" y="250"/>
        <use href="#dot-platinum" x="280" y="180"/>
        <use href="#dot-platinum" x="350" y="140"/>
        <use href="#dot-platinum" x="320" y="300"/>
        <use href="#dot-platinum" x="400" y="300"/>
        <use href="#dot-platinum" x="440" y="250"/>
        <use href="#dot-platinum" x="550" y="80"/>
        <use href="#dot-platinum" x="700" y="80"/>
        <use href="#dot-platinum" x="520" y="250"/>
        <use href="#dot-platinum" x="650" y="300"/>
        <use href="#dot-platinum" x="800" y="300"/>
        <use href="#dot-platinum" x="850" y="250"/>
        <use href="#dot-platinum" x="1000" y="250"/>
        <use href="#dot-platinum" x="150" y="320"/>
        <use href="#dot-platinum" x="200" y="380"/>
        <use href="#dot-platinum" x="400" y="440"/>
        <use href="#dot-platinum" x="550" y="440"/>
        <use href="#dot-platinum" x="620" y="500"/>
        <use href="#dot-platinum" x="650" y="400"/>
        <use href="#dot-platinum" x="750" y="450"/>
        <use href="#dot-platinum" x="900" y="450"/>
        <use href="#dot-platinum" x="980" y="380"/>
        <use href="#dot-platinum" x="900" y="120"/>
        <use href="#dot-platinum" x="1050" y="120"/>

        <!-- Gold Nodes -->
        <use href="#dot-gold" x="100" y="150"/>
        <use href="#dot-gold" x="200" y="150"/>
        <use href="#dot-gold" x="250" y="200"/>
        <use href="#dot-gold" x="380" y="200"/>
        <use href="#dot-gold" x="500" y="150"/>
        <use href="#dot-gold" x="180" y="250"/>
        <use href="#dot-gold" x="180" y="350"/>
        <use href="#dot-gold" x="250" y="400"/>
        <use href="#dot-gold" x="400" y="400"/>
        <use href="#dot-gold" x="380" y="300"/>
        <use href="#dot-gold" x="480" y="350"/>
        <use href="#dot-gold" x="600" y="350"/>
        <use href="#dot-gold" x="800" y="400"/>
        <use href="#dot-gold" x="600" y="220"/>
        <use href="#dot-gold" x="700" y="160"/>
        <use href="#dot-gold" x="850" y="160"/>
        <use href="#dot-gold" x="900" y="220"/>
        <use href="#dot-gold" x="1050" y="220"/>
        <use href="#dot-gold" x="850" y="80"/>
        <use href="#dot-gold" x="950" y="50"/>
        <use href="#dot-gold" x="980" y="480"/>
    </g>

    <!-- Cubes & Assets Overlay (Midground) -->
    <g>
        <!-- Left Section -->
        <use href="#cube-platinum" x="80" y="380" transform="scale(1.2) translate(-15, -60)"/>
        <use href="#cube-gold" x="200" y="150" transform="scale(1)"/>
        <use href="#cube-platinum" x="300" y="280" transform="scale(0.8) translate(0,0)"/>
        <use href="#orb-platinum" x="60" y="220" transform="scale(0.9) translate(0,0)"/>

        <!-- Center Section -->
        <use href="#cube-platinum" x="420" y="150" transform="scale(1.1)"/>
        <use href="#cube-gold" x="500" y="350" transform="scale(1)"/>
        <use href="#cube-platinum" x="650" y="400" transform="scale(1.4) translate(-20, -10)"/>
        <use href="#cube-gold" x="700" y="160" transform="scale(0.9)"/>
        <use href="#cube-platinum" x="380" y="440" transform="scale(1.2)"/>
        <use href="#orb-gold" x="550" y="100" transform="scale(0.8)"/>
        <use href="#orb-platinum" x="800" y="400" transform="scale(0.8)"/>

        <!-- Right Section -->
        <use href="#cube-gold" x="900" y="220" transform="scale(1.1)"/>
        <use href="#cube-platinum" x="1000" y="450" transform="scale(1)"/>
        <use href="#cube-platinum" x="1100" y="160" transform="scale(0.8)"/>
        <use href="#orb-platinum" x="950" y="150" transform="scale(0.6)"/>

        <!-- Locks (representing security/assets) -->
        <use href="#lock-gold" x="395" y="130"/>
        <use href="#lock-gold" x="475" y="325"/>
        <use href="#lock-gold" x="680" y="145"/>
    </g>

    <!-- ========================================== -->
    <!-- FOREGROUND EXTREME BLUR (Depth of Field)   -->
    <!-- ========================================== -->
    <g filter="url(#blur-extreme)" opacity="0.6">
        <use href="#orb-gold" x="-10" y="50" transform="scale(2)"/>
        <use href="#orb-platinum" x="250" y="-30" transform="scale(1.8)"/>
        <use href="#cube-platinum" x="30" y="520" transform="scale(3)"/>
        <use href="#cube-gold" x="1150" y="480" transform="scale(2.5)"/>
        <use href="#orb-platinum" x="1200" y="80" transform="scale(3)"/>

        <!-- A big out-of-focus line crossing foreground -->
        <path d="M -50,150 L 300,300" stroke="#DDAA33" stroke-width="8" opacity="0.4"/>
    </g>

    <!-- ========================================== -->
    <!-- MAIN TYPOGRAPHY                            -->
    <!-- ========================================== -->
    <g transform="translate(80, 145)">
        <!-- Radix Babylon Ledger App -->
        <text x="0" y="0" font-size="44" font-weight="700" fill="#2C261A" letter-spacing="0.5">Radix Babylon Ledger App</text>

        <!-- Atomic Composability -->
        <text x="0" y="130" font-size="60" font-weight="800" fill="#C29317" letter-spacing="1">Atomic Composability</text>

        <!-- Unlocking Modular Logic & Assets. -->
        <text x="0" y="195" font-size="34" font-weight="400" fill="#7A6E59" letter-spacing="0.5">Desbloqueando lógica modular &amp; Activos.</text>
    </g>

    <!-- ========================================== -->
    <!-- BOTTOM LOGOS (Ledger & Radix)              -->
    <!-- ========================================== -->
    <g transform="translate(80, 450)">
        <!-- Ledger Logo -->
        <g>
            <!-- Brackets -->
            <path d="M 22,0 L 0,0 L 0,22" fill="none" stroke="#2C261A" stroke-width="4"/>
            <path d="M 0,38 L 0,60 L 22,60" fill="none" stroke="#2C261A" stroke-width="4"/>
            <path d="M 154,0 L 176,0 L 176,22" fill="none" stroke="#2C261A" stroke-width="4"/>
            <path d="M 176,38 L 176,60 L 154,60" fill="none" stroke="#2C261A" stroke-width="4"/>
            <!-- Text -->
            <text x="20" y="42" font-size="32" font-weight="bold" fill="#2C261A" letter-spacing="3">LEDGER</text>
        </g>

        <!-- Vertical Divider -->
        <line x1="240" y1="0" x2="240" y2="60" stroke="#2C261A" stroke-width="2" opacity="0.2"/>

        <!-- Radix Logo -->
        <g transform="translate(295, 10)">
            <!-- Radix Root Symbol -->
            <path d="M 0,20 L 12,20 L 24,40 L 46,0 L 62,0" fill="none" stroke="#C29317" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
            <!-- Text -->
            <text x="50" y="32" font-size="30" font-weight="bold" fill="#2C261A" letter-spacing="4">RADIX</text>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT SIDE 3D ICON                         -->
    <!-- ========================================== -->
    <g transform="translate(970, 270) rotate(14) skewX(-12) scale(1, 0.95)">

        <!-- 3D Extrusion/Shadow Depth (Soft warm shadows for light theme) -->
        <rect x="-115" y="-120" width="290" height="290" rx="55" fill="url(#card-shadow)"/>
        <rect x="-137" y="-132" width="290" height="290" rx="55" fill="#A89F8F" opacity="0.3"/>

        <!-- Main Front Face (Light Metallic Gold Gradient) -->
        <rect x="-140" y="-145" width="290" height="290" rx="55" fill="url(#card-front)"/>

        <!-- The Big Checkmark / Root Symbol -->
        <g transform="translate(-35, -15)">
            <!-- Soft Warm Drop Shadow -->
            <path d="M -70,20 L -30,20 L 10,95 L 90,-65 L 140,-65" fill="none" stroke="#A38840" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-soft)" opacity="0.5" transform="translate(12, 18)"/>
            <path d="M -70,20 L -30,20 L 10,95 L 90,-65 L 140,-65" fill="none" stroke="#B89742" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" transform="translate(5, 8)"/>

            <!-- Pure White Checkmark -->
            <path d="M -70,20 L -30,20 L 10,95 L 90,-65 L 140,-65" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
    </g>

</svg>
