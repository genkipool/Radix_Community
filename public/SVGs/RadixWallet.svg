<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 900" width="100%" height="100%" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: transparent;">
    <defs>
        <!-- Auras and Blurs -->
        <filter id="aura-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="70" />
        </filter>
        <filter id="shadow-left" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="25" dy="35" stdDeviation="30" flood-color="#071526" flood-opacity="0.25" />
        </filter>
        <filter id="shadow-right" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="15" dy="25" stdDeviation="25" flood-color="#071526" flood-opacity="0.15" />
        </filter>
        <filter id="ticket-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#071526" flood-opacity="0.04" />
        </filter>
        <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#071526" flood-opacity="0.06" />
        </filter>

        <!-- Gradients -->
        <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00829f" />
            <stop offset="100%" stop-color="#00e5a3" />
        </linearGradient>
        <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6928cf" />
            <stop offset="100%" stop-color="#da48ef" />
        </linearGradient>
        <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#006aff" />
            <stop offset="100%" stop-color="#00ccff" />
        </linearGradient>

        <!-- Phone Screen Cliping -->
        <clipPath id="phone-clip">
            <rect width="360" height="740" rx="45" />
        </clipPath>

        <!-- Reusable Status Bar -->
        <g id="status-bar">
            <text x="35" y="32" font-size="15" font-weight="600" fill="#0b1b2e">9:29</text>
            <!-- Cellular -->
            <rect x="290" y="24" width="3" height="5" rx="1.5" fill="#0b1b2e" />
            <rect x="295" y="20" width="3" height="9" rx="1.5" fill="#0b1b2e" />
            <rect x="300" y="15" width="3" height="14" rx="1.5" fill="#0b1b2e" />
            <!-- Wifi -->
            <path d="M 310 20 A 8 8 0 0 1 320 20 M 312 24 A 4 4 0 0 1 318 24 M 315 28 A 1 1 0 0 1 315.1 28" stroke="#0b1b2e" stroke-width="2" stroke-linecap="round" fill="none" />
            <!-- Battery -->
            <rect x="325" y="16" width="22" height="12" rx="4" stroke="#0b1b2e" stroke-width="1.5" fill="none" />
            <rect x="327" y="18" width="14" height="8" rx="2" fill="#0b1b2e" />
            <path d="M 349 20 L 349 24" stroke="#0b1b2e" stroke-width="1.5" stroke-linecap="round" />
        </g>
    </defs>

    <!-- Background Magical Auras -->
    <ellipse cx="180" cy="180" rx="220" ry="240" fill="#ff9df0" filter="url(#aura-blur)" opacity="0.65" />
    <ellipse cx="650" cy="250" rx="240" ry="260" fill="#c789ff" filter="url(#aura-blur)" opacity="0.6" />
    <ellipse cx="250" cy="780" rx="230" ry="200" fill="#7affd9" filter="url(#aura-blur)" opacity="0.55" />
    <ellipse cx="750" cy="650" rx="200" ry="220" fill="#99c6ff" filter="url(#aura-blur)" opacity="0.5" />

    <!-- ========================================== -->
    <!-- RIGHT PHONE (BACKGROUND) - RADIX WALLET    -->
    <!-- ========================================== -->
    <g transform="translate(460, 80) scale(0.92)">
        <!-- Phone Base and Shadow -->
        <rect width="360" height="740" rx="45" fill="#ffffff" filter="url(#shadow-right)" />
        <rect width="360" height="740" rx="45" fill="#ffffff" stroke="#e8eff5" stroke-width="3" />

        <g clip-path="url(#phone-clip)">
            <use href="#status-bar" />

            <!-- Header -->
            <text x="25" y="110" font-size="26" font-weight="700" fill="#091b33">Radix Wallet</text>
            <!-- Settings Gear Icon -->
            <path d="M 322 93 C 322.5 93 323 93.5 323 94 L 324 97 C 325 97.5 326 98 327 99 L 330 98 C 330.5 98 331 98.5 331 99 L 333 101 C 333.5 101.5 333 102 332 102 L 331 105 C 331.5 106 331.5 107 331 108 L 332 111 C 333 111.5 333.5 112 333 112.5 L 331 114.5 C 330.5 115 330 114.5 329.5 114.5 L 326.5 113.5 C 325.5 114 324.5 114.5 323.5 114.5 L 322.5 117.5 C 322.5 118 322 118.5 319.5 118.5 L 317.5 118.5 C 317 118.5 316.5 118 316.5 117.5 L 315.5 114.5 C 314.5 114.5 313.5 114 312.5 113.5 L 309.5 114.5 C 309 114.5 308.5 115 308 114.5 L 306 112.5 C 305.5 112 306 111.5 306.5 111 L 307.5 108 C 307 107 307 106 307.5 105 L 306.5 102 C 306 102 305.5 101.5 306 101 L 308 99 C 308.5 98.5 309 98 309.5 98 L 312.5 99 C 313.5 98 314.5 97.5 315.5 97 L 316.5 94 C 316.5 93.5 317 93 317.5 93 Z M 319.5 100 A 6 6 0 1 0 319.5 112 A 6 6 0 1 0 319.5 100 Z" fill="none" stroke="#091b33" stroke-width="2" stroke-linejoin="round" />

            <!-- Subtitle -->
            <text x="25" y="135" font-size="14" fill="#64748b">Welcome, here are all of your</text>
            <text x="25" y="155" font-size="14" fill="#64748b">accounts on the Radix Network</text>

            <!-- Card 1: Main Account -->
            <rect x="25" y="190" width="310" height="125" rx="12" fill="url(#grad-teal)" />
            <text x="45" y="218" font-size="14" font-weight="700" fill="#ffffff">Main Account</text>
            <text x="45" y="238" font-size="13" fill="rgba(255,255,255,0.85)">acco...23eda1</text>
            <!-- Copy Icon -->
            <rect x="138" y="227" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />
            <rect x="135" y="224" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

            <!-- Tokens (Main Account) -->
            <g transform="translate(45, 275)">
                <!-- Generic 1 -->
                <circle cx="10" cy="15" r="14" fill="#2d3748" stroke="#00d69f" stroke-width="1.5" />
                <path d="M 6 15 L 10 19 L 16 11" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" />
                <!-- Bitcoin -->
                <circle cx="30" cy="15" r="14" fill="#f7931a" stroke="url(#grad-teal)" stroke-width="1.5" />
                <text x="30" y="20" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">B</text>
                <!-- Ethereum -->
                <circle cx="50" cy="15" r="14" fill="#627eea" stroke="url(#grad-teal)" stroke-width="1.5" />
                <polygon points="50,6 54,13 50,18 46,13" fill="#fff" />
                <polygon points="50,20 54,15 50,24 46,15" fill="#fff" />
                <!-- Generic 2 -->
                <circle cx="70" cy="15" r="14" fill="#141d26" stroke="url(#grad-teal)" stroke-width="1.5" />
                <circle cx="70" cy="15" r="6" fill="#fff" />
                <!-- NFT Badge 1 -->
                <rect x="90" y="3" width="46" height="24" rx="12" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                <circle cx="102" cy="15" r="8" fill="#5033e6" />
                <text x="122" y="19" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
                <!-- NFT Badge 2 -->
                <rect x="142" y="3" width="46" height="24" rx="12" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                <circle cx="154" cy="15" r="8" fill="#0263e0" />
                <text x="174" y="19" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
            </g>

            <!-- Card 2: Savings -->
            <rect x="25" y="330" width="310" height="125" rx="12" fill="url(#grad-purple)" />
            <text x="45" y="358" font-size="14" font-weight="700" fill="#ffffff">Savings</text>
            <text x="45" y="378" font-size="13" fill="rgba(255,255,255,0.85)">acco...e32aq5</text>
            <!-- Copy Icon -->
            <rect x="138" y="367" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />
            <rect x="135" y="364" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

            <!-- Tokens (Savings) -->
            <g transform="translate(45, 415)">
                <!-- Check Icon (XRD) -->
                <circle cx="10" cy="15" r="14" fill="#0263e0" stroke="url(#grad-purple)" stroke-width="1.5" />
                <path d="M 5 15 L 9 19 L 16 11" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" />
                <!-- rUSD Icon -->
                <circle cx="34" cy="15" r="14" fill="#00d69f" stroke="url(#grad-purple)" stroke-width="1.5" />
                <text x="34" y="20" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">$</text>
            </g>

            <!-- Card 3: My NFT's -->
            <rect x="25" y="470" width="310" height="125" rx="12" fill="url(#grad-blue)" />
            <text x="45" y="498" font-size="14" font-weight="700" fill="#ffffff">My NFT's</text>
            <text x="45" y="518" font-size="13" fill="rgba(255,255,255,0.85)">acco...77r4t2</text>
            <!-- Copy Icon -->
            <rect x="134" y="507" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />
            <rect x="131" y="504" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

            <!-- Tokens (NFTs) -->
            <g transform="translate(45, 555)">
                <rect x="0" y="3" width="50" height="24" rx="12" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                <circle cx="12" cy="15" r="8" fill="#4ade80" />
                <text x="32" y="19" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12</text>
            </g>

            <!-- Create Account Button -->
            <rect x="65" y="625" width="230" height="42" rx="8" fill="#e2e8f0" />
            <text x="180" y="651" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Create a new Account</text>

            <!-- Bottom Home Indicator -->
            <rect x="120" y="725" width="120" height="5" rx="2.5" fill="#000000" />
        </g>

        <!-- Dynamic Island Overlay -->
        <rect x="125" y="12" width="110" height="30" rx="15" fill="#000000" />
    </g>


    <!-- ========================================== -->
    <!-- LEFT PHONE (FOREGROUND) - TRANSACTION      -->
    <!-- ========================================== -->
    <g transform="translate(85, 45)">
        <!-- Phone Base and Shadow -->
        <rect width="360" height="740" rx="45" fill="#ffffff" filter="url(#shadow-left)" />
        <rect width="360" height="740" rx="45" fill="#ffffff" stroke="#f1f5f9" stroke-width="3" />

        <g clip-path="url(#phone-clip)">
            <!-- Reusable Status Bar -->
            <use href="#status-bar" />

            <!-- Close Icon -->
            <path d="M 28 75 L 42 89 M 42 75 L 28 89" stroke="#091b33" stroke-width="2.5" stroke-linecap="round" />

            <!-- Code Bracket Icon -->
            <rect x="296" y="65" width="36" height="36" rx="8" fill="#f1f5f9" />
            <path d="M 309 77 L 304 83 L 309 89 M 319 77 L 324 83 L 319 89" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

            <!-- Header Title -->
            <text x="28" y="135" font-size="28" font-weight="700" fill="#091b33" letter-spacing="-0.5">Review Your</text>
            <text x="28" y="168" font-size="28" font-weight="700" fill="#091b33" letter-spacing="-0.5">Transaction</text>

            <!-- ============================== -->
            <!-- Zig-Zag Ticket Background Area -->
            <!-- ============================== -->
            <path d="M 0 215
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     l 10 -6 l 10 6 l 10 -6 l 10 6 l 10 -6 l 10 6
                     L 360 690
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     l -10 6 l -10 -6 l -10 6 l -10 -6 l -10 6 l -10 -6
                     Z" fill="#f6f8fb" filter="url(#ticket-shadow)" />

            <!-- Label: WITHDRAWING FROM -->
            <text x="28" y="248" font-size="12" font-weight="700" fill="#8494a5" letter-spacing="0.5">WITHDRAWING FROM</text>

            <!-- Card 1: Withdrawing (Teal) -->
            <!-- Drop Shadow for Card 1 -->
            <rect x="28" y="260" width="304" height="100" rx="14" fill="#ffffff" filter="url(#card-shadow)" />
            <!-- Card 1 Header Path (Top rounded only) -->
            <path d="M 28 274 A 14 14 0 0 1 42 260 L 318 260 A 14 14 0 0 1 332 274 L 332 298 L 28 298 Z" fill="url(#grad-teal)" />
            <!-- Card 1 Body Path (Bottom rounded only) -->
            <path d="M 28 298 L 332 298 L 332 346 A 14 14 0 0 1 318 360 L 42 360 A 14 14 0 0 1 28 346 Z" fill="#ffffff" />

            <!-- Card 1 Header Text -->
            <text x="42" y="284" font-size="14" font-weight="700" fill="#ffffff">My Main Account</text>
            <text x="310" y="284" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="end">acco...2qgtxg</text>
            <rect x="315" y="275" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

            <!-- Card 1 Body Contents (rUSD) -->
            <circle cx="58" cy="328" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
            <path d="M 58 316 L 58 340 M 54 318 C 48 318 48 326 54 328 C 62 331 62 338 54 338" stroke="#125299" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <text x="92" y="333" font-size="14" font-weight="600" fill="#091b33">rUSD</text>
            <text x="318" y="333" font-size="16" font-weight="700" fill="#091b33" text-anchor="end">20.00</text>


            <!-- ============================== -->
            <!-- DApps Connection Middle Section -->
            <!-- ============================== -->

            <!-- Dotted line from Card 1 down -->
            <line x1="180" y1="365" x2="180" y2="405" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

            <!-- "Using dApps ^" Text -->
            <text x="210" y="393" font-size="12" font-weight="600" fill="#8494a5" text-anchor="end">Using dApps ^</text>

            <!-- Dotted line connecting horizontally to dApps text -->
            <line x1="180" y1="388" x2="215" y2="388" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

            <!-- RadiSwap Box -->
            <rect x="120" y="405" width="120" height="42" rx="8" fill="#ffffff" filter="url(#card-shadow)" stroke="#e2e8f0" stroke-width="1" />
            <rect x="128" y="413" width="26" height="26" rx="6" fill="#001433" />
            <path d="M 141 418 L 141 434 M 133 426 L 149 426 M 135 420 L 147 432 M 135 432 L 147 420" stroke="#00d69f" stroke-width="2" stroke-linecap="round" fill="none" />
            <text x="162" y="431" font-size="13" font-weight="600" fill="#64748b">RadiSwap</text>

            <!-- Dotted line from RadiSwap down -->
            <line x1="180" y1="447" x2="180" y2="480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />


            <!-- Label: DEPOSITING TO -->
            <text x="28" y="475" font-size="12" font-weight="700" fill="#8494a5" letter-spacing="0.5">DEPOSITING TO</text>

            <!-- Card 2: Depositing (Purple) -->
            <rect x="28" y="490" width="304" height="150" rx="14" fill="#ffffff" filter="url(#card-shadow)" />
            <!-- Card 2 Header Path -->
            <path d="M 28 504 A 14 14 0 0 1 42 490 L 318 490 A 14 14 0 0 1 332 504 L 332 528 L 28 528 Z" fill="url(#grad-purple)" />
            <!-- Card 2 Body Path -->
            <path d="M 28 528 L 332 528 L 332 626 A 14 14 0 0 1 318 640 L 42 640 A 14 14 0 0 1 28 626 Z" fill="#ffffff" />

            <!-- Card 2 Header Text -->
            <text x="42" y="514" font-size="14" font-weight="700" fill="#ffffff">My Savings Account</text>
            <text x="310" y="514" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="end">acco...39fm48</text>
            <rect x="315" y="505" width="8" height="10" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

            <!-- Card 2 Body Contents (XRD) -->
            <circle cx="58" cy="565" r="24" fill="#001433" />
            <path d="M 50 565 L 56 571 L 67 559" stroke="#00d69f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <text x="94" y="570" font-size="14" font-weight="600" fill="#091b33">XRD</text>

            <text x="318" y="560" font-size="13" fill="#64748b" text-anchor="end">Estimated <tspan font-weight="700" fill="#091b33">32.78688</tspan></text>
            <text x="318" y="578" font-size="12" fill="#8494a5" text-anchor="end">Guaranteed 31.14753</text>

            <!-- Customize Guarantees Link -->
            <text x="180" y="622" font-size="13" font-weight="700" fill="#0256cc" text-anchor="middle">Customize Guarantees</text>

            <!-- ============================== -->
            <!-- Footer Transaction Fee Area    -->
            <!-- ============================== -->
            <text x="32" y="720" font-size="12" font-weight="700" fill="#8494a5" letter-spacing="0.5">TRANSACTION FEE</text>
            <!-- Info Icon -->
            <circle cx="162" cy="716" r="6.5" stroke="#cbd5e1" stroke-width="1.5" fill="none" />
            <text x="162" y="720" font-size="10" font-weight="700" fill="#8494a5" text-anchor="middle">i</text>

            <!-- Fee Amount -->
            <text x="330" y="720" font-size="13" font-weight="700" fill="#091b33" text-anchor="end">XRD 0.1</text>

            <!-- Bottom Home Indicator -->
        </g>

        <!-- Dynamic Island Overlay -->
    </g>
</svg>
