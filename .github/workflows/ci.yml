name: CI (Code Quality & Build)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Build Project
        run: pnpm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
