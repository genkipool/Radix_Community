name: CI (Code Quality & Build)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true # a security release must not wait for the runner image
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Production dependencies only. node-forge has no patched release yet
      # (GHSA-86w9-cpqp-85rv) and only parses our own .p12, never verifies a
      # signature; drop the --ignore once a fixed version exists.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high --ignore GHSA-86w9-cpqp-85rv

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Build Project
        run: pnpm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
